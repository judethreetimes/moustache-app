function getTimestamp() {
  const d = new Date();
  return `[${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}]`;
}

function addLogLine(text, type) {
  const line = document.createElement('div');
  line.className = `log-line ${type}`;
  line.innerHTML = `<span class="timestamp">${getTimestamp()}</span>${text}`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
}

function shuffleArray(arr) {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

uploadZone.addEventListener('click', () => {
  if (!hasImage) fileInput.click();
});

uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadZone.style.borderColor = '#f0d878';
});

uploadZone.addEventListener('dragleave', () => {
  uploadZone.style.borderColor = '';
});

uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.style.borderColor = '';
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith('image/')) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    uploadZone.innerHTML = `<img src="${e.target.result}" class="preview-img" alt="Your moustache">`;
    uploadZone.classList.add('has-image');
    hasImage = true;
    analyseBtn.disabled = false;
  };
  reader.readAsDataURL(file);
}

analyseBtn.addEventListener('click', runAnalysis);

async function runAnalysis() {
  attempts++;
  analyseBtn.disabled = true;
  resultBox.classList.remove('visible');
  logBox.innerHTML = '';
  logBox.classList.add('visible');
  progressContainer.classList.add('visible');
  progressBar.style.width = '0%';

  const baseMsgs = shuffleArray(analysisMsgs);
  const bonus = shuffleArray(extraMsgs).slice(0, 4 + Math.min(attempts, 6));
  const allMsgs = [...baseMsgs.slice(0, 10), ...bonus, ...baseMsgs.slice(10)];

  for (let i = 0; i < allMsgs.length; i++) {
    const delay = 200 + Math.random() * 500;
    await new Promise(r => setTimeout(r, delay));
    addLogLine(allMsgs[i].text, allMsgs[i].type);
    progressBar.style.width = `${Math.min(((i + 1) / allMsgs.length) * 100, 100)}%`;
  }

  await new Promise(r => setTimeout(r, 600));
  progressBar.style.width = '100%';
  await new Promise(r => setTimeout(r, 400));

  gameWindow.classList.add('shake');
  setTimeout(() => gameWindow.classList.remove('shake'), 500);

  verdictText.textContent = pickRandom(verdicts);
  messageText.textContent = pickRandom(messages);
  resultBox.classList.add('visible');

  tryAgainBtn.textContent = `\u21B4 ${pickRandom(tryAgainTexts)}`;

  uploadCountEl.innerHTML = `Moustaches rejected: <span>${attempts}</span> | Dad's approval rate: <span>0%</span>`;

  resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

tryAgainBtn.addEventListener('click', () => {
  hasImage = false;
  uploadZone.innerHTML = `
    <span class="sword-icon">&#9876;</span>
    <p>Drop thy moustache portrait here<br>or <span class="highlight">click to choose file</span></p>
    <input type="file" id="fileInput" accept="image/*">
  `;
  uploadZone.classList.remove('has-image');

  const newFileInput = document.getElementById('fileInput');
  newFileInput.addEventListener('change', () => {
    if (newFileInput.files.length) handleFile(newFileInput.files[0]);
  });

  analyseBtn.disabled = true;
  logBox.classList.remove('visible');
  progressContainer.classList.remove('visible');
  resultBox.classList.remove('visible');
  progressBar.style.width = '0%';
});
